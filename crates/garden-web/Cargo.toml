[package]
name = "garden-web"
version = "0.1.0"
edition.workspace = true

[dependencies]
garden-core = { path = "../garden-core" }
garden-editor = { path = "../garden-editor" }
leptos = { version = "0.8.23", features = ["csr"] }
web-sys = { version = "0.3", features = ["DomRect", "Element", "HtmlElement", "MouseEvent", "PointerEvent", "WheelEvent", "KeyboardEvent", "EventTarget", "Window", "HtmlInputElement", "ResizeObserver"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.7"
kurbo = "0.13.1"
